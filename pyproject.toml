[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-vadahub-api"
version = "0.1.0"
description = "VadaHub 공개 웹 및 공간자료용 비동기 Python provider"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["playwright>=1.45,<2"]

[project.optional-dependencies]
spatial = ["gdal>=3.8,<4"]
dev = ["build", "mypy>=1.10", "pytest>=8", "pytest-asyncio>=0.23", "pytest-cov"]

[project.urls]
Repository = "https://github.com/digitie/python-vadahub-api"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["vadahub*"]

[tool.setuptools.package-data]
vadahub = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["live: 실제 공개 VadaHub와 Chromium을 사용하는 검증", "spatial: GDAL Python binding이 필요한 공간 검증"]

[tool.mypy]
python_version = "3.11"
files = ["src/vadahub"]
